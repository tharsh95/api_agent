[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-integration-agent"
version = "0.1.0"
description = "LangGraph agent for the AI Integration Engineer"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
