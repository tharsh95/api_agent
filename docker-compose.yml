services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-engineer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_engineer
      POSTGRES_PASSWORD: ai_engineer_dev
      POSTGRES_DB: ai_engineer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_engineer -d ai_engineer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-engineer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: